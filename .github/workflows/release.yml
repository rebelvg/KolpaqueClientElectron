name: Build and release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: darwin
            runner: macos-latest
          - platform: win32
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package application
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: yarn run package "$PLATFORM" "$RUNNER_TEMP"

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ runner.temp }}/KolpaqueClientElectron-*-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts

      - name: Create release and upload ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/KolpaqueClientElectron-*-*.zip)
          if (( ${#assets[@]} != 4 )); then
            echo "Expected four ZIPs (Linux x64, Windows x64, macOS x64/arm64)."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes '' --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
